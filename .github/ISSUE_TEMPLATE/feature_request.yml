name: Предложить улучшение
description: Предложение по развитию анализатора, срезов, PDF или документации
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу без реальных ТЖ и клиентских результатов. Для примеров используйте только синтетические или необратимо обезличенные данные.
  - type: checkboxes
    id: preliminary_checks
    attributes:
      label: Предварительная проверка
      options:
        - label: Я проверил существующие issues и pull requests
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - Анализатор ТЖ
        - Верификация результатов
        - Аналитические срезы
        - PDF-модуль
        - Документация и примеры
        - Другое
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Какая задача не решается сейчас
      description: Опишите пользовательскую задачу и ограничения текущего поведения.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
      description: Укажите ожидаемые входы, результат и критерии приёмки.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Контракты и совместимость
      description: Какие JSON, CSV, SQLite, конфигурации, CLI или PDF-контракты могут измениться?
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
  - type: checkboxes
    id: privacy
    attributes:
      label: Конфиденциальность
      options:
        - label: В предложении нет реальных журналов, результатов анализа, клиентских идентификаторов или секретов
          required: true
